<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CASE Studio UML Mobile - Asistente de Voz y Diagramador Multiplataforma">

  <!-- Mobile Viewport & PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="UML Voice Mobile">

  <title>CASE UML Mobile - Voice & Canvas</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0b0f19;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #94a3b8;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e293b;
      border-top-color: #a855f7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading-indicator">
    <div class="spinner"></div>
    <div style="font-weight: 600; color: #f8fafc;">CASE Studio UML Mobile</div>
    <div style="font-size: 12px; margin-top: 6px;">Cargando motor de voz y diagramador...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
